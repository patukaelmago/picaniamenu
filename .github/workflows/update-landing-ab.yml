name: Update landing Carta A/B

on:
  push:
    paths:
      - '.github/workflows/update-landing-ab.yml'

permissions:
  contents: write

jobs:
  update-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Actualizar sección Carta A/B
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = '''            <p className="mt-6 text-lg leading-8 text-[#5E6573]">
              Prepará dos versiones de tu menú y elegí cuál publicar. Tus clientes
              siempre ingresan desde el mismo enlace y el mismo código QR.
            </p>
            <div className="mt-8 space-y-4">
              <Benefit text="Editá Carta A o Carta B por separado" />
              <Benefit text="Mostrá u ocultá productos con el ojo" />
              <Benefit text="Publicá otra carta sin cambiar el QR" />
            </div>'''
          new = '''            <p className="mt-6 text-lg leading-8 text-[#5E6573]">
              Prepará dos versiones de tu menú para distintos días, horarios o servicios.
              Podés cambiar entre Carta A y Carta B manualmente o programar el cambio automático,
              siempre usando el mismo enlace y el mismo código QR.
            </p>
            <div className="mt-8 space-y-4">
              <Benefit text="Editá Carta A y Carta B por separado" />
              <Benefit text="Programá días y horarios para cambiar de carta automáticamente" />
              <Benefit text="Un solo QR: tus clientes siempre ven la carta que corresponde" />
            </div>
            <div className="mt-8 rounded-2xl border border-[#DDE0E5] bg-[#F8F6F1] p-5">
              <p className="font-black text-[#151A24]">Ejemplo</p>
              <p className="mt-2 leading-7 text-[#5E6573]">
                Usá la Carta A para tu menú habitual y programá la Carta B para almuerzos,
                noches, fines de semana o eventos. Cuando llega el horario configurado,
                Carta Online hace el cambio por vos.
              </p>
            </div>'''
          if old not in s: raise SystemExit('No se encontró la sección esperada')
          s = s.replace(old, new)
          old2 = '''              <div className="rounded-lg bg-[#EAF0FF] px-4 py-3 text-xs font-bold text-[#1D2E58]">
                Cada carta conserva su visibilidad y orden. El mismo QR muestra la carta publicada.
              </div>'''
          new2 = '''              <div className="rounded-lg bg-[#EAF0FF] px-4 py-3 text-xs font-bold text-[#1D2E58]">
                Cada carta conserva su visibilidad y orden. El mismo QR muestra la carta publicada.
              </div>
              <div className="rounded-xl border bg-white p-4 shadow-sm">
                <p className="font-black">Cambio automático de carta</p>
                <p className="mt-1 text-[10px] text-[#69708B]">Programá qué carta mostrar según el día y el horario.</p>
                <div className="mt-4 flex flex-wrap gap-1.5 text-[10px] font-bold">
                  {['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((day) => (
                    <span key={day} className={day === 'Jue' || day === 'Vie' ? 'rounded border border-[#D80E1F] bg-[#D80E1F] px-2 py-1 text-white' : 'rounded border px-2 py-1 text-[#1D2E58]'}>{day}</span>
                  ))}
                </div>
                <div className="mt-3 grid grid-cols-[1fr_1fr_auto] items-end gap-2 text-[10px]">
                  <div><p className="font-bold">Desde</p><div className="mt-1 rounded border px-2 py-1.5">10:00</div></div>
                  <div><p className="font-bold">Hasta</p><div className="mt-1 rounded border px-2 py-1.5">17:00</div></div>
                  <div className="flex overflow-hidden rounded border font-bold"><span className="px-2 py-1.5">A</span><span className="bg-[#D80E1F] px-2 py-1.5 text-white">B</span></div>
                </div>
              </div>'''
          if old2 not in s: raise SystemExit('No se encontró el preview esperado')
          p.write_text(s.replace(old2, new2))
      - name: Commit
        run: |
          git config user.name "Carta Online Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: explicar automatización de Carta A/B en landing"
          git push
# trigger
